name: Live Data Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: live-data-refresh
  cancel-in-progress: false

jobs:
  refresh-live-data:
    name: Scrape ESPN and commit live data snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape latest ESPN World Cup data
        run: python src/scraping/scrape_latest_results.py

      - name: Validate refreshed project data
        run: python scripts/validate_project_data.py --output reports/data_quality_latest.json

      - name: Commit live data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/raw/espn_worldcup_scoreboard.json \
            data/processed/worldcup_2026_live_results.csv \
            reports/data_quality_latest.json

          if git diff --cached --quiet; then
            echo "No live data changes to commit."
          else
            git commit -m "Refresh live World Cup data [skip ci]"
            git pull --rebase
            git push
          fi
